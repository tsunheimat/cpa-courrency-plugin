name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify committed module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build release assets
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}"
      - name: Verify checksum
        run: cd dist && sha256sum --check checksums.txt
      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpa-account-concurrency-${{ github.ref_name }}
          path: |
            dist/cpa-account-concurrency_*.zip
            dist/checksums.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/cpa-account-concurrency_*.zip \
            dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
