name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test and verify release metadata
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registered_version="$(sed -n 's/.*Version: "\([0-9][0-9.]*\)".*/\1/p' main.go | head -n 1)"
          test "$registered_version" = "$version"
          grep -Fq "\"version\": \"$version\"" registry.json
          grep -Fq "Current release: \`v$version\`" README.md

      - name: Verify committed module files
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: |
          set -euo pipefail
          go mod verify
          go test ./...
          go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared -ldflags="-buildid=" \
              -o "dist/cpa-account-concurrency.${{ matrix.ext }}" .
          rm -f dist/cpa-account-concurrency.h

      - name: Upload platform library
        uses: actions/upload-artifact@v4
        with:
          name: cpa-account-concurrency-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cpa-account-concurrency.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Package and publish release
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Download platform libraries
        uses: actions/download-artifact@v4
        with:
          pattern: cpa-account-concurrency-*
          path: staging
          merge-multiple: false

      - name: Package release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist package

          package_target() {
            local goos="$1"
            local goarch="$2"
            local ext="$3"
            local library="cpa-account-concurrency.${ext}"
            local source="staging/cpa-account-concurrency-${goos}-${goarch}/${library}"
            local archive="cpa-account-concurrency_${version}_${goos}_${goarch}.zip"

            test -s "$source"
            rm -rf package/*
            cp "$source" "package/$library"
            (
              cd package
              zip -X -q -9 "../dist/$archive" "$library"
            )
            test "$(unzip -Z1 "dist/$archive")" = "$library"
          }

          package_target linux amd64 so
          package_target linux arm64 so
          package_target darwin amd64 dylib
          package_target darwin arm64 dylib
          package_target windows amd64 dll

          (
            cd dist
            sha256sum cpa-account-concurrency_*.zip > checksums.txt
            sha256sum --check checksums.txt
          )

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpa-account-concurrency-${{ github.ref_name }}
          path: |
            dist/cpa-account-concurrency_*.zip
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/cpa-account-concurrency_*.zip \
            dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
