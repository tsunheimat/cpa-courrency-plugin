name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Set up Go
        uses: actions/setup-go@e626ada899467caf4efc6cfd0484b965da944ce8
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify committed module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build-platforms:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            library: cpa-account-concurrency.so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            library: cpa-account-concurrency.so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            library: cpa-account-concurrency.dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            library: cpa-account-concurrency.dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            library: cpa-account-concurrency.dll
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Set up Go
        uses: actions/setup-go@e626ada899467caf4efc6cfd0484b965da944ce8
        with:
          go-version-file: go.mod
          cache: true
      - name: Build shared library
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |\n          mkdir dist\n          go build -trimpath -buildmode=c-shared -ldflags="-buildid=" -o "dist/${{ matrix.library }}" .
